name = "freyd"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Freyd", "AOP", "leet", "rel", "diag"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
linter.unusedSectionVars = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[lean_lib]]
name = "Freyd"           # book core: curated aggregator Freyd.lean stays the single root (no glob,
                         # to avoid force-building the deliberately un-imported orphan scaffolding)

[[lean_lib]]
name = "AOP"             # Algebra-of-Programming layer; glob so every AOP/*.lean is in the default build
globs = ["AOP.+"]

[[lean_lib]]
name = "leet"            # LeetCode case studies
globs = ["leet.+"]

[[lean_lib]]
name = "rel"             # the relation-algebra interpreter + case studies + auto-derivation drivers
globs = ["rel.+"]

[[lean_lib]]
name = "diag"            # diagrammatic-calculus tower (cartesian bicategory → tapes → fo-bicategory)
globs = ["diag.+"]

[[lean_exe]]
name = "lean-refactor"
root = "Freyd.tool.LeanRefactor"
supportInterpreter = true
