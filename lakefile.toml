name = "freyd"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Freyd", "AOP", "diag"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
linter.unusedSectionVars = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[lean_lib]]
name = "Freyd"           # book core: curated aggregator Freyd.lean stays the single root (no glob,
                         # to avoid force-building the deliberately un-imported orphan scaffolding)

[[lean_lib]]
name = "AOP"             # Algebra-of-Programming layer; glob so every AOP/*.lean is in the default build
globs = ["AOP.+"]

# `leet` (LeetCode case studies) and `rel` (the relation-algebra interpreter, its auto-derivation
# drivers and the LeetRun studies) are OUT of the default build: nothing in `Freyd` or `AOP` imports
# them, and rebuilding them on every AOP edit was the bulk of a build.  Their sources stay in the
# tree; declare a lean_lib again to bring either back.

[[lean_lib]]
name = "diag"            # diagrammatic-calculus tower (cartesian bicategory → tapes → fo-bicategory)
globs = ["diag.+"]

[[lean_exe]]
name = "diag-export"     # draw a declaration's STATEMENT as a string diagram (diag/generated/*.typ)
root = "diag.tool.DiagExport"
supportInterpreter = true
